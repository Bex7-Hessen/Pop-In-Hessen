<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7ec8f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stachelsprung">
  <meta name="description" content="Stachelsprung – tippen, springen, hangeln, klettern.">
  <title>Stachelsprung</title>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #7ec8f0;
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
    #mute {
      position: fixed; top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right));
      width: 44px; height: 44px; border: 0; border-radius: 22px;
      background: rgba(255,255,255,.55); font-size: 22px; line-height: 44px; padding: 0;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <button id="mute" aria-label="Ton an/aus">🔊</button>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const muteBtn = document.getElementById('mute');

  // ---------- Einstellungen (alles in Welt-Einheiten) ----------
  const GRAVITY = 2600;
  const JUMP_V = 950;
  const START_SPEED = 240;
  const MAX_SPEED = 950;
  const SPEED_PER_POINT = 9;
  const SPEED_PER_SEC = 2.5;
  const PLAYER_W = 26, PLAYER_H = 70;
  const REACH = 95;           // so hoch über den Füßen sind die Hände, wenn er sie hochreißt
  const JUMP_BUFFER = 0.13;   // Tipp kurz vor der Landung zählt trotzdem
  const COYOTE = 0.07;        // kurz nach Verlassen des Bodens darf man noch springen

  // Hangelstange
  const BAR_H = 190;          // Höhe der Stange über dem Boden
  const SPIKE_H = 22;
  // Wand
  const WALL_H = 230, WALL_W = 54;
  const CLIMB_STEP = 21;      // pro Tipp
  const CLIMB_SLIDE = 22;     // rutscht pro Sekunde zurück

  // ---------- Bildschirm ----------
  let dpr = 1, scale = 1, viewW = 0, viewH = 0, groundY = 0, playerX = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    // Im Hochformat etwas herauszoomen, damit man die Hindernisse früh genug sieht
    scale = Math.min(h / 420, w / 460);
    viewW = w / scale;
    viewH = h / scale;
    // Im Hochformat den Boden höher setzen, damit das Geschehen in der Bildmitte liegt
    groundY = Math.min(viewH * 0.78, viewH * 0.45 + 180);
    playerX = Math.max(70, viewW * 0.18);
    buildSkyline();
  }

  // ---------- Hintergrund: Stadt-Silhouette ----------
  let skylineFar = [], skylineNear = [];
  function makeLayer(minH, maxH, minW, maxW) {
    const arr = [];
    let x = 0;
    while (x < viewW + 400) {
      const w = minW + Math.random() * (maxW - minW);
      const h = minH + Math.random() * (maxH - minH);
      const lit = [];
      for (let wy = 12; wy < h - 10; wy += 16)
        for (let wx = 8; wx < w - 10; wx += 14)
          if (Math.random() < 0.35) lit.push([wx, wy]);
      arr.push({ x, w, h, lit });
      x += w + 4 + Math.random() * 14;
    }
    arr.width = x;
    return arr;
  }
  function buildSkyline() {
    skylineFar = makeLayer(60, 170, 40, 90);
    skylineNear = makeLayer(40, 120, 50, 110);
  }

  // ---------- Ton ----------
  let audio = null, muted = false;
  try { muted = localStorage.getItem('stachelsprung-mute') === '1'; } catch (e) {}
  muteBtn.textContent = muted ? '🔇' : '🔊';
  function beep(freq, dur, type, vol, slide) {
    if (muted) return;
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      const t = audio.currentTime;
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
      g.gain.setValueAtTime(vol || 0.08, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(audio.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  const sfx = {
    jump: () => beep(380, 0.15, 'square', 0.05, 760),
    point: () => { beep(880, 0.08, 'triangle', 0.08); setTimeout(() => beep(1320, 0.1, 'triangle', 0.07), 70); },
    bonus: () => { beep(660, 0.08, 'triangle', 0.08); setTimeout(() => beep(990, 0.08, 'triangle', 0.08), 80); setTimeout(() => beep(1320, 0.14, 'triangle', 0.08), 160); },
    grab: () => beep(520, 0.07, 'triangle', 0.07),
    climb: () => beep(300 + Math.random() * 120, 0.05, 'square', 0.035),
    crash: () => beep(220, 0.45, 'sawtooth', 0.09, 50),
  };

  // ---------- Spielzustand ----------
  let state = 'start';      // 'start' | 'play' | 'over'
  let score = 0, best = 0, elapsed = 0, speed = START_SPEED;
  let distance = 0, overTime = 0, shake = 0, newBest = false, overMsg = null;
  let player, obstacles, popups, nextGap, spawnRight, jumpBufferT, hintsShown;
  try { best = parseInt(localStorage.getItem('stachelsprung-best'), 10) || 0; } catch (e) {}

  function reset() {
    score = 0; elapsed = 0; speed = START_SPEED; distance = 0; newBest = false; overMsg = null;
    player = {
      y: 0, vy: 0, onGround: true, airT: 0, runPhase: 0, dead: false, deadRot: 0,
      hang: null,     // Hangelstange, an der er gerade hängt
      climb: null,    // Wand, die er gerade hochklettert
      climbH: 0, climbT: 0, climbLimit: 0, climbPhase: 0,
    };
    obstacles = []; popups = [];
    nextGap = 380;  // erster Abstand: man hat etwas Zeit
    spawnRight = viewW + 30;  // rechte Kante der zuletzt erzeugten Welle
    jumpBufferT = 0;
    hintsShown = { bar: 0, wall: 0 };
  }
  reset();

  function startGame() {
    reset();
    state = 'play';
  }

  function gameOver(msg) {
    state = 'over';
    overMsg = msg || null;
    overTime = 0;
    shake = 14;
    player.dead = true;
    player.hang = null;
    player.climb = null;
    player.vy = -500;
    sfx.crash();
    if (navigator.vibrate) { try { navigator.vibrate(120); } catch (e) {} }
    if (score > best) {
      best = score; newBest = true;
      try { localStorage.setItem('stachelsprung-best', String(best)); } catch (e) {}
    }
  }

  function tryJump() {
    if (player.hang || player.climb) return false;
    const canJump = player.onGround || player.airT < COYOTE;
    if (canJump && player.vy >= 0) {
      player.vy = -JUMP_V;
      player.onGround = false;
      player.airT = COYOTE;
      jumpBufferT = 0;
      sfx.jump();
      return true;
    }
    return false;
  }

  function addScore(n, y) {
    score += n;
    popups.push({ x: playerX, y, t: 0, txt: '+' + n });
    if (n > 1) sfx.bonus(); else sfx.point();
  }

  function press() {
    if (state === 'start') { startGame(); tryJump(); return; }
    if (state === 'over') { if (overTime > 0.7) startGame(); return; }
    if (player.climb) {
      player.climbH += CLIMB_STEP;
      player.climbPhase++;
      sfx.climb();
      return;
    }
    if (player.hang) return;
    if (!tryJump()) jumpBufferT = JUMP_BUFFER;
  }

  // ---------- Eingabe ----------
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') {
      e.preventDefault();
      if (!e.repeat) press();
    }
  });
  muteBtn.addEventListener('pointerdown', e => e.stopPropagation());
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    try { localStorage.setItem('stachelsprung-mute', muted ? '1' : '0'); } catch (e) {}
  });
  document.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- Hindernisse ----------
  // Alle Hindernisse haben x (linke Kante) und w (Breite) in Welt-Einheiten.
  function addBall(x) {
    // Später werden die Kugeln etwas größer
    const r = 20 + Math.random() * 6 + Math.min(score, 40) * 0.15;
    obstacles.push({ type: 'ball', x, w: 2 * r, r, rot: 0, scored: false });
    return 2 * r;
  }

  function addBar(x) {
    // Stachelfeld darunter ist immer länger als ein Sprung weit reicht
    const spikeW = speed * 0.95 + 130;
    const lead = 70, tail = 50;
    obstacles.push({ type: 'bar', x, w: lead + spikeW + tail, sx: lead, sw: spikeW, scored: false });
    return lead + spikeW + tail;
  }

  function addWall(x) {
    obstacles.push({ type: 'wall', x, w: WALL_W, h: WALL_H, scored: false });
    return WALL_W;
  }

  // Verschiebt alle Hindernisse (und die Spawn-Kante) um d
  function shiftWorld(d) {
    for (const o of obstacles) o.x += d;
    spawnRight += d;
  }

  function spawnWave() {
    const x = viewW + 30;
    const before = obstacles.length;
    const airTime = 2 * JUMP_V / GRAVITY;
    let extra = 0;  // zusätzlicher Abstand danach (z. B. Sturz von der Wand)
    const roll = Math.random();
    if (score >= 5 && roll < 0.14) {
      addBar(x);
    } else if (score >= 8 && roll < 0.26) {
      addWall(x);
      extra = speed * 0.45;
    } else {
      const w = addBall(x);
      // Ab 15 Punkten kommen manchmal zwei Kugeln direkt hintereinander
      if (score >= 15 && Math.random() < 0.22) addBall(x + w + 2);
    }
    spawnRight = x;
    for (let i = before; i < obstacles.length; i++) spawnRight = Math.max(spawnRight, obstacles[i].x + obstacles[i].w);
    // Abstand zur nächsten Welle: nie kürzer als ein Sprung + Landung
    const minGap = speed * (airTime + 0.18) + 60 + extra;
    const spread = 220 + 380 * Math.max(0.25, 1 - score / 60);
    nextGap = minGap + Math.random() * spread;
  }

  // ---------- Update ----------
  function update(dt) {
    if (state === 'over') overTime += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 40);

    // Popups
    for (const p of popups) { p.t += dt; p.y -= 40 * dt; }
    popups = popups.filter(p => p.t < 0.8);

    if (state === 'start') {
      player.runPhase += dt * 6;
      distance += 60 * dt;
      return;
    }

    if (state === 'over') {
      // Strichmännchen fällt um
      player.vy += GRAVITY * dt;
      player.y = Math.min(0, player.y + player.vy * dt);
      if (player.y === 0) player.vy = 0;
      player.deadRot = Math.min(Math.PI / 2, player.deadRot + dt * 6);
      return;
    }

    // --- Spiel läuft ---
    elapsed += dt;
    speed = Math.min(MAX_SPEED, START_SPEED + score * SPEED_PER_POINT + elapsed * SPEED_PER_SEC);
    if (jumpBufferT > 0) jumpBufferT -= dt;

    const left = playerX - PLAYER_W / 2, right = playerX + PLAYER_W / 2;

    // --- Klettern: Welt steht still, nur schnelles Tippen bringt ihn hoch ---
    if (player.climb) {
      const wall = player.climb;
      player.climbT += dt;
      player.climbH = Math.max(0, player.climbH - CLIMB_SLIDE * dt);
      player.y = -player.climbH;
      if (player.climbH >= wall.h - 8) {
        // Oben angekommen: auf die Wand ziehen und weiterlaufen
        player.climb = null;
        player.y = -wall.h;
        player.vy = 0;
        player.onGround = true;
        jumpBufferT = 0;
        wall.scored = true;
        addScore(3, groundY - wall.h - PLAYER_H - 20);
        // ein Stück auf die Wand schieben, damit er sicher oben steht
        shiftWorld(-PLAYER_W * 0.6);
      } else if (player.climbT > player.climbLimit) {
        gameOver('Zu langsam geklettert!');
      }
      return;
    }

    const dx = speed * dt;
    distance += dx;
    shiftWorld(-dx);
    for (const o of obstacles) if (o.type === 'ball') o.rot -= dx / o.r;
    obstacles = obstacles.filter(o => o.x + o.w > -60);

    // --- Hangeln: hängt an der Stange, bis sie zu Ende ist ---
    if (player.hang) {
      const bar = player.hang;
      player.y = -(BAR_H - REACH);
      player.vy = 0;
      player.climbPhase += dt * (4 + speed / 60);
      if (playerX > bar.x + bar.w - 8) {
        player.hang = null;   // loslassen und runterfallen
        player.onGround = false;
        if (!bar.scored) { bar.scored = true; addScore(2, groundY + player.y - PLAYER_H - 20); }
      }
    } else {
      // Normale Physik. Boden ist 0 oder die Oberkante einer Wand, auf der er steht.
      const prevH = -player.y;
      player.vy += GRAVITY * dt;
      player.y += player.vy * dt;
      let floorH = 0;
      for (const o of obstacles) {
        if (o.type === 'wall' && right > o.x && left < o.x + o.w && prevH >= o.h - 0.5) floorH = o.h;
      }
      if (-player.y <= floorH) {
        player.y = -floorH; player.vy = 0;
        if (!player.onGround) { player.onGround = true; player.airT = 0; }
        if (jumpBufferT > 0) tryJump();
      } else {
        player.onGround = false;
        player.airT += dt;
      }
    }
    player.runPhase += dt * (6 + speed / 45);

    // Neue Hindernisse. Der Abstand wird an der Spawn-Kante gemessen, nicht an den
    // noch sichtbaren Hindernissen: im Hochformat ist der Abstand bei hohem Tempo
    // breiter als der Bildschirm, die letzte Kugel ist dann schon links verschwunden.
    if ((viewW + 30) - spawnRight >= nextGap) spawnWave();

    // Kollision & Punkte
    const height = -player.y;
    const bottom = groundY + player.y, top = bottom - PLAYER_H;
    for (const o of obstacles) {
      if (o.type === 'ball') {
        const cx = o.x + o.r, cy = groundY - o.r;
        const nx = Math.max(left, Math.min(cx, right));
        const ny = Math.max(top, Math.min(cy, bottom));
        const hitR = o.r * 0.82;  // etwas gnädig, die Stacheln sind spitz
        if ((cx - nx) ** 2 + (cy - ny) ** 2 < hitR * hitR) { gameOver(); return; }
        if (!o.scored && o.x + o.w < left) {
          o.scored = true;
          addScore(1, bottom - PLAYER_H - 20);
        }
      } else if (o.type === 'bar') {
        const inBar = playerX >= o.x && playerX <= o.x + o.w;
        // Festhalten, sobald die Hände die Stange erreichen
        if (!player.hang && inBar && !player.onGround && height + REACH >= BAR_H) {
          player.hang = o;
          player.climbPhase = 0;
          sfx.grab();
        }
        // Ins Stachelfeld gefallen?
        const sL = o.x + o.sx + 4, sR = o.x + o.sx + o.sw - 4;
        if (!player.hang && height < SPIKE_H - 4 && right > sL && left < sR) { gameOver(); return; }
      } else if (o.type === 'wall') {
        // Gegen die Wand gelaufen oder gesprungen: festhalten und klettern
        if (right > o.x && left < o.x + o.w && height < o.h - 0.5 && !o.scored) {
          shiftWorld(right - o.x);
          player.climb = o;
          player.climbH = height;
          player.climbT = 0;
          player.climbLimit = Math.max(3.3, 4.6 - score * 0.015);
          player.vy = 0;
          player.onGround = false;
          jumpBufferT = 0;
          sfx.grab();
          return;
        }
      }
    }
  }

  // ---------- Zeichnen ----------
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, groundY);
    g.addColorStop(0, '#4fa8e0');
    g.addColorStop(1, '#bfe6fb');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, viewW, groundY + 1);
    // Sonne
    ctx.fillStyle = '#fff2b0';
    ctx.beginPath(); ctx.arc(viewW - 90, Math.max(70, groundY * 0.22), 34, 0, Math.PI * 2); ctx.fill();
  }

  function drawLayer(layer, factor, color, winColor) {
    const off = (distance * factor) % layer.width;
    for (let rep = 0; rep < 2; rep++) {
      for (const b of layer) {
        const x = b.x - off + rep * layer.width;
        if (x > viewW || x + b.w < 0) continue;
        ctx.fillStyle = color;
        ctx.fillRect(x, groundY - b.h, b.w, b.h);
        if (winColor) {
          ctx.fillStyle = winColor;
          for (const [wx, wy] of b.lit) ctx.fillRect(x + wx, groundY - b.h + wy, 6, 8);
        }
      }
    }
  }

  function drawGround() {
    ctx.fillStyle = '#3d4450';
    ctx.fillRect(0, groundY, viewW, viewH - groundY);
    ctx.fillStyle = '#596170';
    ctx.fillRect(0, groundY, viewW, 6);
    // Fahrbahnmarkierung
    ctx.fillStyle = '#e8e8e8';
    const off = distance % 80;
    for (let x = -off; x < viewW; x += 80) ctx.fillRect(x, groundY + 26, 40, 5);
  }

  function drawBall(b) {
    const cy = groundY - b.r;
    ctx.save();
    ctx.translate(b.x + b.r, cy);
    ctx.rotate(b.rot);
    // Stacheln
    const spikes = 12, spikeLen = b.r * 0.42;
    ctx.fillStyle = '#c9ced6';
    ctx.strokeStyle = '#2a2d33';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < spikes; i++) {
      const a = (i / spikes) * Math.PI * 2;
      const a1 = a - 0.2, a2 = a + 0.2;
      const rIn = b.r * 0.8, rOut = b.r + spikeLen * 0.55;
      ctx.moveTo(Math.cos(a1) * rIn, Math.sin(a1) * rIn);
      ctx.lineTo(Math.cos(a) * rOut, Math.sin(a) * rOut);
      ctx.lineTo(Math.cos(a2) * rIn, Math.sin(a2) * rIn);
    }
    ctx.fill(); ctx.stroke();
    // Kugel
    const g = ctx.createRadialGradient(-b.r * 0.3, -b.r * 0.3, b.r * 0.1, 0, 0, b.r * 0.85);
    g.addColorStop(0, '#9aa1ab');
    g.addColorStop(1, '#3a3f47');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, b.r * 0.85, 0, Math.PI * 2); ctx.fill();
    ctx.stroke();
    // Markierung, damit man das Rollen sieht
    ctx.fillStyle = '#c0392b';
    ctx.beginPath(); ctx.arc(b.r * 0.4, 0, b.r * 0.14, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawBarBack(o) {
    // Pfosten (hinter dem Spieler)
    ctx.strokeStyle = '#6b4a2b';
    ctx.lineWidth = 6;
    ctx.lineCap = 'butt';
    ctx.beginPath();
    ctx.moveTo(o.x + 4, groundY); ctx.lineTo(o.x + 4, groundY - BAR_H - 6);
    ctx.moveTo(o.x + o.w - 4, groundY); ctx.lineTo(o.x + o.w - 4, groundY - BAR_H - 6);
    ctx.stroke();
    // Stachelfeld
    const sx = o.x + o.sx;
    ctx.fillStyle = '#7a1f1f';
    ctx.fillRect(sx, groundY - 5, o.sw, 5);
    ctx.fillStyle = '#c9ced6';
    ctx.strokeStyle = '#2a2d33';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    const n = Math.max(3, Math.round(o.sw / 16));
    const step = o.sw / n;
    for (let i = 0; i < n; i++) {
      const x0 = sx + i * step;
      ctx.moveTo(x0, groundY - 4);
      ctx.lineTo(x0 + step / 2, groundY - SPIKE_H);
      ctx.lineTo(x0 + step, groundY - 4);
    }
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }

  function drawBarFront(o) {
    // Die Stange selbst (vor dem Spieler, damit die Hände sie greifen)
    const y = groundY - BAR_H;
    ctx.strokeStyle = '#2a2d33';
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(o.x, y); ctx.lineTo(o.x + o.w, y); ctx.stroke();
    ctx.strokeStyle = '#d7dbe0';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(o.x + 2, y - 1); ctx.lineTo(o.x + o.w - 2, y - 1); ctx.stroke();
  }

  function drawWall(o) {
    const x = o.x, y = groundY - o.h;
    ctx.fillStyle = '#a5523a';
    ctx.fillRect(x, y, o.w, o.h);
    // Ziegel
    ctx.strokeStyle = 'rgba(60,25,15,0.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    const bh = 14, bw = 27;
    for (let row = 0, yy = groundY; yy > y; row++, yy -= bh) {
      ctx.moveTo(x, yy); ctx.lineTo(x + o.w, yy);
      for (let xx = x + (row % 2 ? bw / 2 : 0); xx < x + o.w; xx += bw) {
        ctx.moveTo(xx, yy); ctx.lineTo(xx, Math.max(y, yy - bh));
      }
    }
    ctx.stroke();
    // Abdeckung oben
    ctx.fillStyle = '#6f7682';
    ctx.fillRect(x - 4, y - 6, o.w + 8, 8);
  }

  function drawStickman() {
    const footY = groundY + player.y;
    ctx.save();
    ctx.translate(playerX, footY);
    if (player.dead) ctx.rotate(-player.deadRot);
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 4.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const hipY = -30, neckY = -54, headR = 9, shY = neckY + 6;
    const mode = player.dead ? 'dead'
      : player.climb ? 'climb'
      : player.hang ? 'hang'
      : (!player.onGround && state === 'play') ? 'air' : 'run';
    const s = Math.sin(player.runPhase);

    // Beine
    ctx.beginPath();
    if (mode === 'air') {
      ctx.moveTo(0, hipY); ctx.lineTo(10, hipY + 12); ctx.lineTo(4, hipY + 26);
      ctx.moveTo(0, hipY); ctx.lineTo(-6, hipY + 14); ctx.lineTo(-14, hipY + 22);
    } else if (mode === 'dead') {
      ctx.moveTo(0, hipY); ctx.lineTo(8, 0);
      ctx.moveTo(0, hipY); ctx.lineTo(-8, 0);
    } else if (mode === 'hang') {
      const sw = Math.sin(player.climbPhase) * 5;
      ctx.moveTo(0, hipY); ctx.lineTo(4 + sw, hipY + 14); ctx.lineTo(2 + sw, hipY + 29);
      ctx.moveTo(0, hipY); ctx.lineTo(-3 - sw, hipY + 14); ctx.lineTo(-2 - sw, hipY + 29);
    } else if (mode === 'climb') {
      // Füße an der Wand, abwechselnd hoch
      const up = player.climbPhase % 2 ? 1 : 0;
      ctx.moveTo(0, hipY); ctx.lineTo(10, hipY + 6 - up * 6); ctx.lineTo(13, hipY + 18 - up * 8);
      ctx.moveTo(0, hipY); ctx.lineTo(9, hipY + 14 - (1 - up) * 6); ctx.lineTo(13, hipY + 28 - (1 - up) * 8);
    } else {
      for (const ph of [s, -s]) {
        const kneeX = ph * 10, kneeY = hipY + 15;
        const footX = ph * 14 - (ph < 0 ? 4 : 0);
        const fy = ph < 0 ? -Math.abs(ph) * 7 : 0;
        ctx.moveTo(0, hipY); ctx.lineTo(kneeX, kneeY); ctx.lineTo(footX, fy);
      }
    }
    ctx.stroke();

    // Körper
    ctx.beginPath(); ctx.moveTo(0, hipY); ctx.lineTo(2, neckY); ctx.stroke();

    // Arme
    ctx.beginPath();
    if (mode === 'air') {
      ctx.moveTo(2, shY); ctx.lineTo(14, shY - 12); ctx.lineTo(20, shY - 24);
      ctx.moveTo(2, shY); ctx.lineTo(-10, shY - 10); ctx.lineTo(-16, shY - 22);
    } else if (mode === 'dead') {
      ctx.moveTo(2, shY); ctx.lineTo(16, shY + 6);
      ctx.moveTo(2, shY); ctx.lineTo(-12, shY + 8);
    } else if (mode === 'hang') {
      // Hände an der Stange, Hand über Hand
      const a = Math.sin(player.climbPhase) * 9;
      const handY = -REACH;
      ctx.moveTo(2, shY); ctx.lineTo(4 + a * 0.5, shY - 22); ctx.lineTo(6 + a, handY);
      ctx.moveTo(2, shY); ctx.lineTo(0 - a * 0.5, shY - 22); ctx.lineTo(-2 - a, handY);
    } else if (mode === 'climb') {
      const up = player.climbPhase % 2 ? 1 : 0;
      ctx.moveTo(2, shY); ctx.lineTo(10, shY - 10); ctx.lineTo(13, shY - 22 - up * 8);
      ctx.moveTo(2, shY); ctx.lineTo(11, shY - 4); ctx.lineTo(13, shY - 12 - (1 - up) * 8);
    } else {
      for (const ph of [-s, s]) {
        ctx.moveTo(2, shY); ctx.lineTo(2 + ph * 10, shY + 12); ctx.lineTo(8 + ph * 12, shY + 20 - Math.abs(ph) * 6);
      }
    }
    ctx.stroke();

    // Kopf
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(4, neckY - headR - 1, headR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // Auge(n)
    ctx.fillStyle = '#111';
    if (player.dead) {
      ctx.lineWidth = 1.8;
      const ex = 8, ey = neckY - headR - 3;
      ctx.beginPath();
      ctx.moveTo(ex - 2.5, ey - 2.5); ctx.lineTo(ex + 2.5, ey + 2.5);
      ctx.moveTo(ex + 2.5, ey - 2.5); ctx.lineTo(ex - 2.5, ey + 2.5);
      ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(8, neckY - headR - (mode === 'climb' ? 5 : 3), 1.8, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    // Schatten (nur wenn Boden darunter)
    if (!player.dead && !player.climb) {
      const k = Math.max(0.3, 1 + player.y / 250);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath(); ctx.ellipse(playerX, groundY + 3, 14 * k, 3 * k, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  function text(str, x, y, size, color, align, weight) {
    ctx.font = `${weight || 800} ${size}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = Math.max(3, size / 7);
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.strokeText(str, x, y);
    ctx.fillStyle = color || '#fff';
    ctx.fillText(str, x, y);
  }

  function drawHints() {
    if (state !== 'play') return;
    // Die ersten zwei Male pro Runde erklären, was zu tun ist
    for (const o of obstacles) {
      if (o.scored || o.x > viewW || o.x < playerX - 20) continue;
      if (o.hintId === undefined) o.hintId = hintsShown[o.type]++;
      if (o.hintId > 1) continue;
      if (o.type === 'bar' && !player.hang) {
        text('Hochspringen & festhalten!', Math.max(130, Math.min(viewW - 130, o.x + 60)), groundY - BAR_H - 34, 17, '#ffe066');
      } else if (o.type === 'wall' && !player.climb) {
        text('Schnell tippen = klettern!', Math.max(130, Math.min(viewW - 130, o.x + o.w / 2)), groundY - o.h - 34, 17, '#ffe066');
      }
    }
    // Während des Kletterns: Zeitbalken und Aufforderung
    if (player.climb) {
      const left = 1 - player.climbT / player.climbLimit;
      const bw = 120, bx = playerX - 20, by = groundY - player.climb.h - 60;
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(bx - 2, by - 2, bw + 4, 14);
      ctx.fillStyle = left > 0.35 ? '#5fd35f' : '#ff6b6b';
      ctx.fillRect(bx, by, bw * Math.max(0, left), 10);
      const pulse = 1 + 0.08 * Math.sin(performance.now() / 60);
      text('TIPP TIPP TIPP!', bx + bw / 2, by - 20, 20 * pulse, '#ffe066');
    }
  }

  function drawHud() {
    if (state !== 'start') {
      text(String(score), viewW / 2, 46, 48, '#fff');
    }
    text('Rekord ' + best, 16, 26, 16, '#fff', 'left', 700);

    for (const p of popups) {
      ctx.globalAlpha = 1 - p.t / 0.8;
      text(p.txt, p.x, Math.max(64, p.y), p.txt === '+1' ? 22 : 28, '#ffe066');
      ctx.globalAlpha = 1;
    }

    // nicht mit der Punktzahl oben überlappen (Querformat ist niedrig)
    const midY = Math.max(140, Math.min(groundY * 0.42, groundY - 150));
    if (state === 'start') {
      text('STACHELSPRUNG', viewW / 2, midY - 40, Math.min(44, viewW / 9), '#fff');
      const blink = 0.6 + 0.4 * Math.sin(performance.now() / 250);
      ctx.globalAlpha = blink;
      text('Tippen zum Starten', viewW / 2, midY + 14, 22, '#ffe066');
      ctx.globalAlpha = 1;
      text('Tippen = Springen · jede Kugel = 1 Punkt', viewW / 2, midY + 48, 15, '#fff', 'center', 600);
      text('Hangeln = 2 Punkte · Klettern = 3 Punkte', viewW / 2, midY + 70, 15, '#fff', 'center', 600);
    } else if (state === 'over') {
      text('AUTSCH!', viewW / 2, midY - 52, 44, '#ff6b6b');
      if (overMsg) text(overMsg, viewW / 2, midY - 14, 18, '#fff', 'center', 700);
      text(score + (score === 1 ? ' Punkt' : ' Punkte'), viewW / 2, midY + 16, 26, '#fff');
      if (newBest) text('Neuer Rekord!', viewW / 2, midY + 46, 20, '#ffe066');
      if (overTime > 0.7) {
        const blink = 0.6 + 0.4 * Math.sin(performance.now() / 250);
        ctx.globalAlpha = blink;
        text('Tippen für neue Runde', viewW / 2, midY + 80, 20, '#fff', 'center', 700);
        ctx.globalAlpha = 1;
      }
    }
  }

  function render() {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawSky();
    drawLayer(skylineFar, 0.15, '#8fb6d2', null);
    drawLayer(skylineNear, 0.35, '#5f7f99', 'rgba(255,240,170,0.55)');
    drawGround();
    for (const o of obstacles) {
      if (o.type === 'ball') drawBall(o);
      else if (o.type === 'bar') drawBarBack(o);
      else if (o.type === 'wall') drawWall(o);
    }
    drawStickman();
    for (const o of obstacles) if (o.type === 'bar') drawBarFront(o);
    drawHints();
    drawHud();
  }

  // ---------- Schleife ----------
  let lastT = performance.now();
  function frame(t) {
    let dt = (t - lastT) / 1000;
    lastT = t;
    if (dt > 0.05) dt = 0.05;           // nach Tab-Wechsel nicht durch Hindernisse teleportieren
    // In kleinen Schritten rechnen, damit schnelle Kugeln nicht durchrutschen
    const steps = Math.ceil(dt / (1 / 120));
    for (let i = 0; i < steps; i++) update(dt / steps);
    render();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => { lastT = performance.now(); });
  resize();
  requestAnimationFrame(t => { lastT = t; frame(t); });
})();
</script>
</body>
</html>
